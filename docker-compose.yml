# Local full stack: Postgres + API. Run the frontend with `npm run dev` in ./frontend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyroots
      POSTGRES_PASSWORD: familyroots
      POSTGRES_DB: familyroots
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyroots"]
      interval: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://familyroots:familyroots@db:5432/familyroots
      JWT_SECRET: local-dev-secret-that-is-long-enough-for-hs256
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
