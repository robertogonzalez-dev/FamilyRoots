server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;  # GEDCOM uploads (matches MAX_GEDCOM_SIZE_MB)

    # All API traffic is prefixed with /api/ — nginx strips it before forwarding
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Uploaded photos are served by the backend
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    # Everything else is the React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
